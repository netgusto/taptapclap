name = "taptapclap"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "taptapclap.sigmoid.lol", custom_domain = true }
]

[assets]
directory = "./dist"

[[durable_objects.bindings]]
name = "CLAP_ROOM"
class_name = "ClapRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClapRoom"]
